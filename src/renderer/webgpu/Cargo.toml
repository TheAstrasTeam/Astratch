[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "29.0.3"
futures = "0.3"

[dependencies]
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
winit = "0.30"
wgpu = "30"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0"
wasm-bindgen = "=0.2.123"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}

[features]
default = []
webgl = ["wgpu/webgl"]
